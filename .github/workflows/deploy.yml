name: Deploy to EC2

# The EC2 instance used for this project has been terminated (AWS Free Tier cleanup),
# so automatic deploys on push are disabled. Re-enable by adding back:
#   push:
#     branches: [ main ]
# after provisioning a new instance and updating the EC2_HOST / EC2_USER / EC2_SSH_KEY secrets.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/RetinaScan-AI
            git pull origin main
            sudo systemctl restart gunicorn
